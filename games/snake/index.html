<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake · Mini Game</title><meta name="theme-color" content="#12161f"><link rel="manifest" href="../../manifest.webmanifest"><link rel="icon" href="../../icons/icon-192.png"><link rel="stylesheet" href="../../style.css">
<style>
body{display:flex;flex-direction:column;align-items:center;touch-action:none;-webkit-user-select:none;user-select:none;padding-top:50px}
h1{margin:6px 0;font-size:16px;color:#58d854;text-shadow:3px 3px 0 #000}#info{margin:8px 0 12px;font-size:10px}#box{position:relative;width:min(calc(100vw - 32px),400px)}canvas{display:block;box-sizing:border-box;width:100%;height:auto;aspect-ratio:1;background:#0f380f;border:4px solid #000;box-shadow:0 0 0 4px #fcfcfc,8px 8px 0 4px #000}
#pad{display:none;grid-template-columns:repeat(3,64px);gap:6px;margin-top:12px}#pad button{height:56px;font:inherit;font-size:16px;border:4px solid #000;background:#7c7c7c;color:#000;box-shadow:3px 3px 0 #000}#pad button:active{transform:translate(3px,3px);box-shadow:none}
body.touch #pad{display:grid}
#over{display:none;position:fixed;inset:0;z-index:30;background:#000d;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
#over.show{display:flex}#adw{width:min(90vw,320px)}
</style></head><body>
<a class="btn alt tool back" href="../../">◀ PORTAL</a><button class="btn tool mute" id="mu">♪ ON</button>
<h1>SNAKE</h1><div id="hint" style="font-size:8px;color:#bcbcbc;max-width:94vw;text-align:center"></div><div id="info">SCORE <b id="s">0</b> · TOP <b id="b" style="color:#f8b800">0</b></div>
<div id="box"><canvas id="c" width="400" height="400"></canvas></div>
<div id="pad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◄</button><button id="p">⏯</button><button data-d="1,0">►</button><span></span><button data-d="0,1">▼</button></div>
<div id="over"><h2 style="margin:0;font-size:22px;color:#e40058;text-shadow:4px 4px 0 #000">GAME OVER</h2><div>SCORE <b id="fs" style="color:#f8b800">0</b></div>
<button class="btn" id="cont">▶ Watch ad to continue</button><button class="btn alt" id="again">↺ Play again</button><div id="adw"></div></div>
<script src="../../ads.js"></script>
<script>
let AC,mute=localStorage.mute==='1';const MU=()=>mu.textContent=mute?'♪ OFF':'♪ ON';MU();mu.onclick=()=>{mute=!mute;localStorage.mute=mute?'1':'0';MU();mu.blur()};
function beep(seq){if(mute)return;try{AC=AC||new AudioContext();let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d}}catch(e){}}
const SFX={eat:[[880,.05],[1320,.07]],die:[[440,.12],[330,.12],[220,.25]],start:[[523,.07],[659,.07],[784,.1]]};

const N=20,S=20,c=document.getElementById('c'),x=c.getContext('2d');
let prev=[],wait,snake,dir,next,food,score,dead,paused,used,best=+localStorage.snakeBest||0;b.textContent=best;
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];prev=snake;dir={x:1,y:0};next=dir;score=0;dead=false;paused=false;wait=true;used=false;s.textContent=0;over.classList.remove('show');place()}
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x==food.x&&p.y==food.y))}
function turn(dx,dy){if(dead)return;if(wait)beep(SFX.start);wait=false;if(dx==-dir.x&&dy==-dir.y)return;next={x:dx,y:dy}}
function die(){dead=true;beep(SFX.die);navigator.vibrate&&navigator.vibrate(150);if(score>best){best=score;localStorage.snakeBest=best;b.textContent=best}
 fs.textContent=score;cont.style.display=used||!navigator.onLine?'none':'';adw.innerHTML='';Ads.inlineBanner(adw);over.classList.add('show');Ads.gameOver()}
function step(){if(dead||paused||wait)return;dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x==h.x&&p.y==h.y))return die();
prev=snake.map(p=>({...p}));snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;s.textContent=score;navigator.vibrate&&navigator.vibrate(20);beep(SFX.eat);place()}else snake.pop()}
again.onclick=reset;
cont.onclick=()=>Ads.rewarded(ok=>{if(!ok)return;used=true;dead=false;wait=true;prev=snake;over.classList.remove('show')});
function draw(f){x.fillStyle='#0f380f';x.fillRect(0,0,400,400);x.fillStyle='#174a17';for(let i=0;i<N;i++)for(let j=(i&1);j<N;j+=2)x.fillRect(i*S,j*S,S,S);
const sq=(px,py,c,k)=>{x.fillStyle='#000';x.fillRect(px,py,S,S);x.fillStyle=c;x.fillRect(px+k,py+k,S-2*k,S-2*k)};
sq(food.x*S,food.y*S,'#e40058',3);x.fillStyle='#fcfcfc';x.fillRect(food.x*S+6,food.y*S+6,4,4);
const pts=snake.map((p,i)=>{const q=prev[i]||p;return[Math.round((q.x+(p.x-q.x)*f)*S),Math.round((q.y+(p.y-q.y)*f)*S)]});
for(let i=pts.length-1;i>=0;i--)sq(pts[i][0],pts[i][1],i?'#58d854':'#b8f818',2);
const h=pts[0];x.fillStyle='#000';x.fillRect(h[0]+5,h[1]+6,3,3);x.fillRect(h[0]+12,h[1]+6,3,3);
if(paused||wait){x.fillStyle='#000b';x.fillRect(0,0,400,400);x.fillStyle='#f8b800';x.font='14px PS2P,monospace';x.textAlign='center';
if(wait&&(performance.now()/500|0)%2==0)x.fillText('PRESS START',200,190);if(paused)x.fillText('PAUSE',200,190);
x.fillStyle='#fcfcfc';x.font='9px PS2P,monospace';if(wait)x.fillText('press a direction to start',200,220)}}
const K={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
addEventListener('keydown',e=>{if(document.querySelector('.modal'))return;if(K[e.key]){e.preventDefault();turn(...K[e.key])}else if(e.key==' '){e.preventDefault();dead?reset():paused=!paused}else if(e.key=='Enter'&&dead)reset()});
document.querySelectorAll('[data-d]').forEach(t=>t.onclick=()=>turn(...t.dataset.d.split(',').map(Number)));p.onclick=()=>paused=!paused;
let sx,sy;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)+Math.abs(dy)<20)return;Math.abs(dx)>Math.abs(dy)?turn(Math.sign(dx),0):turn(0,Math.sign(dy))});
const touch='ontouchstart' in window||navigator.maxTouchPoints>0;if(touch)document.body.classList.add('touch');
const H=m=>hint.textContent=m;H(touch?'Swipe screen or use buttons to move':'Use arrows / WASD · Space to pause');
let gpPrev='';addEventListener('gamepadconnected',()=>H('🎮 Gamepad connected · D-pad/analog to move, Start to pause'));
function pollPad(){const g=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);if(!g)return;
const bt=i=>g.buttons[i]&&g.buttons[i].pressed,ax=g.axes[0]||0,ay=g.axes[1]||0;let d='';
if(bt(12)||ay<-.5)d='0,-1';else if(bt(13)||ay>.5)d='0,1';else if(bt(14)||ax<-.5)d='-1,0';else if(bt(15)||ax>.5)d='1,0';else if(bt(9))d='p';
if(d&&d!=gpPrev){d=='p'?(dead?reset():paused=!paused):turn(...d.split(',').map(Number))}gpPrev=d}
const T=110;let last=performance.now(),acc=0;
function loop(now){pollPad();acc+=now-last;last=now;if(acc>500)acc=T;while(acc>=T){acc-=T;prev=snake;step()}draw(dead||paused||wait?1:acc/T);requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
