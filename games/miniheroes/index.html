<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Heroes · Mini Game</title><meta name="theme-color" content="#0f0f1b"><link rel="manifest" href="../../manifest.webmanifest"><link rel="icon" href="../../icons/icon-192.png"><link rel="stylesheet" href="../../style.css">
<style>
html,body{overflow-x:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:44px 6px 16px;touch-action:manipulation}
h1{margin:2px 0;font-size:14px;color:var(--yellow);text-shadow:3px 3px 0 #000}
#hud{width:min(100%,480px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:9px;background:var(--panel);border:4px solid #000;padding:4px 6px}
#hud b{color:var(--yellow)} .r{display:inline-block;width:8px;height:8px;border:1px solid #000;margin-right:3px;vertical-align:-1px}
#herobar{width:100%;font-size:8px;color:#ccc}
canvas{display:block;width:min(100%,480px);aspect-ratio:4/3;margin-top:6px;background:#000;border:4px solid #000;box-shadow:0 0 0 3px #7c7c7c;touch-action:none;cursor:pointer}
#msg{width:min(100%,480px);font-size:9px;color:var(--green);min-height:30px;margin:6px 0 2px;text-align:center;line-height:1.5}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(100%,480px)}
.bar .btn,.sb{padding:7px 8px;font-size:9px;box-shadow:3px 3px 0 #000;border-width:3px}
.btn.g{background:var(--green);color:#000}.btn.y{background:var(--yellow);color:#000}.btn.p{background:#d858f8;color:#000}
.btn[disabled]{opacity:.35;pointer-events:none}
#panel{display:none;position:fixed;inset:0;z-index:30;background:#000b;align-items:center;justify-content:center}
#panel.show{display:flex}
.pbox{width:min(calc(100vw - 16px),460px);max-height:88vh;overflow-y:auto;background:var(--panel);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:10px;font-size:9px;line-height:1.7}
.pbox h2{font-size:12px;margin:0 0 6px;color:var(--yellow);text-shadow:2px 2px 0 #000}
.pbox h3{font-size:10px;margin:10px 0 4px;color:var(--blue)}
.it{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:2px solid #000;padding:4px 0}
.it .t{flex:1;min-width:0}.it small{color:#aaa;font-size:8px;display:block}
.no{color:#e40058}.ok{color:var(--green)}
#hint{font-size:8px;color:#888;margin-top:10px;text-align:center;max-width:480px;line-height:1.6}
</style></head><body>
<a class="btn alt tool back" href="../../">◀ PORTAL</a>
<button class="btn tool mute" id="mute">SND</button>
<h1>MINI HEROES</h1>
<div id="hud"><span id="res"></span><span id="cal"></span><div id="herobar"></div></div>
<canvas id="c" width="480" height="360"></canvas>
<div id="msg"></div>
<div class="bar" id="mapbar">
 <button class="btn g" data-a="endday">END DAY</button><button class="btn alt" data-a="town">TOWN</button>
 <button class="btn y" data-a="hero">HERO</button><button class="btn alt" data-a="next">NEXT</button><button class="btn" data-a="menu">MENU</button>
</div>
<div class="bar" id="battlebar" style="display:none">
 <button class="btn g" data-a="resolve">RESOLVE</button><button class="btn p" data-a="spell">SPELL</button>
 <button class="btn alt" data-a="auto">AUTO PLAN</button><button class="btn y" data-a="binfo">HELP</button>
</div>
<div id="hint">Tap a tile to see the path, tap again to go. Keys: arrows move, Enter go, E end day, T town, H hero.</div>
<div id="panel"><div class="pbox" id="pbox"></div></div>
<script src="data.js"></script>
<script src="game.js"></script>
</body></html>
