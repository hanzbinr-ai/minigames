#cele .cbox img{width:48px;height:48px;image-rendering:pixelated}#cele b{font-size:clamp(12px,3.2vw,22px);color:var(--a);text-shadow:3px 3px 0 #000}#cele small{font-size:10px;color:#fff}
#cele.go .cbox{animation:cpop 1.5s ease-out forwards}@keyframes cpop{0%{transform:scale(.2);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{transform:scale(1.05) translateY(-20px);opacity:0}}

.tres{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 10px;background:#0f0f1b;border-bottom:3px solid #000;font-size:10px}.tres span{display:flex;align-items:center;gap:4px}.tres img{width:20px;height:20px;image-rendering:pixelated}.tres small{color:var(--green);font-size:8px}
.mkt{border:3px solid #000;background:#0f0f1b;padding:5px;margin:4px 0}.mkt img{width:18px;height:18px;image-rendering:pixelated}.mkt .bar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:2px 0}.mkt small{font-size:7px;opacity:.8}.mrange{flex:1;min-width:90px;accent-color:#f8b800}.mprev{flex:1;font-size:8px}

.it.form{align-items:center}.dz{display:inline-block;width:12px;height:12px;background:#3cbcfc80;border:2px solid #3cbcfc;vertical-align:middle}.hlp summary{cursor:pointer;color:var(--blue);margin:4px 0}.hlp div{font-size:7px;margin:2px 0}
#mmapw{position:absolute;right:6px;bottom:44px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;z-index:3}#mmap{width:min(36vw,150px);height:auto;image-rendering:pixelated;border:3px solid #000;background:#000;box-shadow:2px 2px 0 #000;cursor:pointer}#mmapw.hide #mmap{display:none}#mmapw .btn{padding:4px 6px;font-size:7px;border-width:2px}

#obj{position:absolute;left:50%;transform:translateX(-50%);top:6px;z-index:4;max-width:min(94%,640px);background:#10102ae8;border:3px solid #f8b800;box-shadow:3px 3px 0 #000;padding:5px 8px;font-size:7px;line-height:1.6;color:#fcfcfc;text-align:center;pointer-events:none}

#dlg .dbox{width:min(94%,620px);background:#10102a;border:4px solid #fcfcfc;box-shadow:0 0 0 4px #000,6px 6px 0 #000;padding:10px 12px;font-size:9px;line-height:1.8;color:#fcfcfc;animation:pop .2s ease-out}
#dlg b{color:#f8b800;display:block;margin-bottom:4px}#dlg p{margin:0 0 6px}#dlg .bar{display:flex;gap:6px;align-items:center;justify-content:flex-end}#dlg i{flex:1;font-style:normal;color:#888;font-size:7px}#dlg .btn{padding:6px 8px;font-size:8px;border-width:3px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mt>div{min-width:0}.mt h3{margin:4px 0}

.msl button{position:relative;aspect-ratio:1;padding:0;background:#0f0f1b;border:3px solid #000;box-shadow:none;min-width:0}.msl button img{width:100%;height:100%;image-rendering:pixelated}.msl button s{position:absolute;right:1px;bottom:0;text-decoration:none;font-size:8px;color:var(--yellow);text-shadow:1px 1px 0 #000}

#mcnt{width:100%;accent-color:#f8b800}
#zoom{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:6px}

#bar{grid-area:bar;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px;background:#1c1c3a;border-top:3px solid #000;padding-bottom:max(6px,env(safe-area-inset-bottom))}
#bar .btn{padding:9px 8px;font-size:9px;border-width:3px;box-shadow:3px 3px 0 #000}

.hcard b{color:var(--yellow);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}.stats div{background:#0f0f1b;border:2px solid #000;padding:4px 0}.stats b{display:block;color:var(--yellow);font-size:11px}

#mini{width:100%;image-rendering:pixelated;border:3px solid #000;background:#000;cursor:pointer}
.lst .btn{display:block;width:100%;margin:3px 0;padding:6px;font-size:8px;text-align:left;border-width:3px;box-shadow:2px 2px 0 #000}

@media (min-width:900px) and (min-height:500px){
 #app{grid-template-columns:1fr 300px;grid-template-areas:"top top" "view side" "view bar"}
 #side{display:flex}#chip{display:none}#ttl{display:block}
 #bar{border-left:3px solid #000;border-top:0}#bar .btn{flex:1 1 40%}
 #res{gap:2px 18px;font-size:10px}#res img{width:24px;height:24px}
}
#panel{display:none;position:fixed;inset:0;z-index:30;background:#000a;align-items:flex-end;justify-content:center}
#panel.show{display:flex}
.pbox{width:100vw;max-height:82dvh;overflow-y:auto;background:var(--panel);border-top:4px solid #000;box-shadow:0 -4px 0 #3cbcfc;padding:10px 10px max(10px,env(safe-area-inset-bottom));font-size:9px;line-height:1.7;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}

.pbox.full{width:100vw;height:100dvh;max-height:100dvh;border:0;box-shadow:none;animation:none;padding:0}

.no{color:#e40058}.ok{color:var(--green)}
.thead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1c1c3a;border-bottom:3px solid #000}

.tview{display:block;width:100%;max-height:34dvh;object-fit:contain;image-rendering:pixelated;background:#000;border-bottom:3px solid #000}
.cols{display:grid;grid-template-columns:1fr;gap:0 16px;padding:0 10px 16px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.rp{background:#0f0f1b;border:3px solid #000;padding:6px 8px;font-size:9px}.rp b{font-size:16px;color:var(--yellow)}.rp .meter{width:100%;margin:4px 0}.rp small{display:block;color:#aaa}
.tl{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:stretch;margin:4px 0;border-bottom:2px solid #000;padding-bottom:4px}.tl>b{font-size:8px;color:var(--blue)}.tl>b small{display:block;color:var(--yellow)}

.fi{display:flex;flex-direction:column;gap:2px}.fu{display:flex;flex-wrap:wrap;gap:2px}.fu img{width:32px;height:32px;image-rendering:pixelated;background:#0f0f1b;border:2px solid #000}
.rpbar{font-size:8px;color:#3cbcfc}.rpbar b{color:var(--yellow)}.rpbar .meter{width:100%}

/* ---- battle: full-viewport field, slim bottom bar, spellbook menu ---- */
body.battle #app{grid-template-columns:100%;grid-template-rows:1fr auto;grid-template-areas:"view" "bar"}
body.battle #top,body.battle #side{display:none!important}
body.battle #bar{border-left:0;border-top:3px solid #000;padding:4px 6px;padding-bottom:max(4px,env(safe-area-inset-bottom));gap:6px;flex-wrap:nowrap}
body.battle #bar .btn{flex:1 1 0;max-width:180px;padding:8px 4px;font-size:8px;box-shadow:2px 2px 0 #000}
body.battle #msg{bottom:4px;font-size:8px}
#book{display:none;position:absolute;inset:0;z-index:20;background:#000b;align-items:center;justify-content:center;perspective:1200px}
#book.show{display:flex}
#book .bk{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(96vw,760px);height:min(86%,520px);background:#5a2a10;border:4px solid #000;box-shadow:0 0 0 3px #a8641c,8px 8px 0 #000;padding:8px;gap:0;transform-style:preserve-3d}
#book .pg{background:#e8d4a0;color:#2a1808;padding:10px 12px;overflow-y:auto;font-size:8px;line-height:1.7;border:2px solid #000;box-shadow:inset 0 0 12px #a8844880}
#book .pg.l{transform-origin:right center;border-right:1px solid #7a5428;box-shadow:inset -10px 0 12px -6px #6a4418}
#book .pg.r{transform-origin:left center;box-shadow:inset 10px 0 12px -6px #6a4418}
#book.show .pg.l{animation:bkl .45s ease-out}#book.show .pg.r{animation:bkr .45s ease-out}#book.show .bk{animation:bkin .3s ease-out}
@keyframes bkl{0%{transform:rotateY(-88deg);opacity:.2}100%{transform:none;opacity:1}}@keyframes bkr{0%{transform:rotateY(88deg);opacity:.2}100%{transform:none;opacity:1}}
@keyframes bkin{0%{transform:scale(.6) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
#book h2{font-size:11px;margin:0 0 6px;color:#7a1020;text-shadow:1px 1px 0 #fff8}#book h3{font-size:9px;margin:8px 0 3px;color:#204080}

 @keyframes bkl{0%{transform:rotateX(88deg);opacity:.2}100%{transform:none;opacity:1}}@keyframes bkr{0%{transform:rotateX(-88deg);opacity:.2}100%{transform:none;opacity:1}}}

<div id="app">

 </footer>
