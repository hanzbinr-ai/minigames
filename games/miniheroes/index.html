<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Heroes · Mini Game</title><meta name="theme-color" content="#1a1a2e"><link rel="manifest" href="../../manifest.webmanifest"><link rel="icon" href="../../icons/icon-192.png"><link rel="stylesheet" href="../../style.css">
<style>
body{display:flex;flex-direction:column;align-items:center;touch-action:none;padding-top:48px;font-family:monospace;background:#0f0f1a;color:#e0e0e0}
h1{margin:4px 0;font-size:16px;color:#f0c040;text-shadow:2px 2px 0 #000}
#hud{font-size:11px;margin:6px 0;text-align:center}#hud b{color:#f0c040}
canvas{display:block;width:min(96vw,520px);aspect-ratio:4/3;background:#1a2a1a;border:4px solid #000;box-shadow:0 0 0 4px #5a5a5a,6px 6px 0 4px #000}
#hint{font-size:10px;color:#aaa;max-width:96vw;text-align:center;margin-top:10px;line-height:1.4}
#msg{font-size:12px;color:#58d854;min-height:18px;margin:4px 0;text-align:center}
#over{display:none;position:fixed;inset:0;background:#000c;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20}
#over.show{display:flex}
</style></head><body>
<a class="btn alt tool back" href="../../">◀ PORTAL</a>
<h1>MINI HEROES</h1>
<div id="hud">GOLD <b id="gold">500</b> · HERO <b id="heroinfo">Lv1</b> · ARMY <b id="army">P:8 A:4</b></div>
<div id="msg"></div>
<canvas id="c" width="480" height="360"></canvas>
<div id="hint">Click near your hero to move (one step)<br>Yellow castle = Town (get gold + recruit)<br>Red skull = Enemy (fight)</div>
<div id="over"><h2 style="color:#e40058;text-shadow:3px 3px 0 #000;margin:0;font-size:22px">GAME OVER</h2><div id="why"></div><button class="btn" id="again">Play Again</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=20,H=15,TILE=24;
let map=[],player,enemies=[],town,gold=500,turn=0,state='map',combat=null;
function showMsg(t){document.getElementById('msg').textContent=t; setTimeout(()=>document.getElementById('msg').textContent='',1800)}
function genMap(){
  map=Array.from({length:H},()=>Array(W).fill(0));
  for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){
    if(Math.random()<0.1) map[y][xx]=1;
    if(Math.random()<0.03) map[y][xx]=2;
  }
  town={x:2,y:2};
  map[town.y][town.x]=3;
  player={x:4,y:4,level:1,exp:0,army:[{type:'Peasant',count:8},{type:'Archer',count:4}]};
  enemies=[
    {x:11,y:6,level:1,army:[{type:'Skeleton',count:6},{type:'Zombie',count:3}]},
    {x:15,y:11,level:2,army:[{type:'Skeleton',count:10},{type:'Zombie',count:5}]}
  ];
}
function drawMap(){
  x.fillStyle='#1a2a1a'; x.fillRect(0,0,480,360);
  for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){
    const px=xx*TILE, py=y*TILE;
    const t=map[y][xx];
    x.fillStyle=t===0?'#2d5a2d':t===1?'#1e3d1e':t===2?'#6a6a6a':'#4a6aaa';
    x.fillRect(px+1,py+1,TILE-2,TILE-2);
    x.strokeStyle='#0004'; x.strokeRect(px,py,TILE,TILE);
    if(t===1){x.fillStyle='#0d2a0d';x.fillRect(px+8,py+6,8,14);x.fillStyle='#2a6a2a';x.fillRect(px+6,py+4,12,6)}
    if(t===2){x.fillStyle='#4a4a4a';x.fillRect(px+4,py+10,16,8)}
    if(t===3){
      x.fillStyle='#c9a227'; x.fillRect(px+3,py+8,18,12);
      x.fillStyle='#e8d48b'; x.fillRect(px+8,py+3,8,8);
      x.fillStyle='#8b1a1a'; x.fillRect(px+10,py+5,4,4);
    }
  }
  // player hero
  const px=player.x*TILE, py=player.y*TILE;
  x.fillStyle='#f0c040';
  x.beginPath(); x.arc(px+12,py+12,11,0,Math.PI*2); x.fill();
  x.fillStyle='#1a1a1a'; x.font='bold 14px monospace'; x.textAlign='center';
  x.fillText('⚔',px+12,py+17);
  // enemies
  enemies.forEach(e=>{
    const ex=e.x*TILE, ey=e.y*TILE;
    x.fillStyle='#d04040';
    x.beginPath(); x.arc(ex+12,ey+12,11,0,Math.PI*2); x.fill();
    x.fillStyle='#fff'; x.fillText('☠',ex+12,ey+17);
  });
  x.textAlign='left';
}
function canMove(nx,ny){
  if(nx<0||ny<0||nx>=W||ny>=H) return false;
  if(map[ny][nx]===2) return false;
  return true;
}
function moveTo(tx,ty){
  if(!canMove(tx,ty)) return;
  const dx=Math.sign(tx-player.x), dy=Math.sign(ty-player.y);
  if(!dx && !dy) return;
  const nx=player.x+dx, ny=player.y+dy;
  if(!canMove(nx,ny)) return;
  player.x=nx; player.y=ny;
  turn++;
  checkEvents();
  if(state==='map') enemyTurn();
}
function checkEvents(){
  if(player.x===town.x && player.y===town.y){
    gold+=60;
    showMsg('+60 Gold from Town!');
    if(gold>=80){
      gold-=80;
      const archer=player.army.find(a=>a.type==='Archer');
      if(archer) archer.count+=2; else player.army.push({type:'Archer',count:2});
      showMsg('Recruited +2 Archers!');
    }
    updateHUD();
  }
  const enemy=enemies.find(e=>e.x===player.x && e.y===player.y);
  if(enemy) startCombat(enemy);
}
function enemyTurn(){
  enemies.forEach(e=>{
    const dx=Math.sign(player.x-e.x), dy=Math.sign(player.y-e.y);
    if(Math.random()<0.5 && canMove(e.x+dx,e.y+dy)){
      e.x+=dx; e.y+=dy;
    }
  });
  const hit=enemies.find(e=>e.x===player.x && e.y===player.y);
  if(hit) startCombat(hit);
  draw();
}
function startCombat(enemy){
  state='combat';
  combat={enemy,playerUnits:JSON.parse(JSON.stringify(player.army)),enemyUnits:JSON.parse(JSON.stringify(enemy.army)),turn:'player'};
  showMsg('Combat started! Click enemy unit.');
  draw();
}
function drawCombat(){
  x.fillStyle='#12121e'; x.fillRect(0,0,480,360);
  x.fillStyle='#f0c040'; x.font='16px monospace'; x.textAlign='center';
  x.fillText('COMBAT',240,28);
  x.font='12px monospace';
  x.fillText('YOUR ARMY',120,55);
  x.fillText('ENEMY',360,55);
  combat.playerUnits.forEach((u,i)=>{
    x.fillStyle='#3a7a3a'; x.fillRect(30,70+i*42,180,36);
    x.fillStyle='#fff'; x.fillText(u.type+'  x'+u.count,120,92+i*42);
  });
  combat.enemyUnits.forEach((u,i)=>{
    x.fillStyle='#7a3a3a'; x.fillRect(270,70+i*42,180,36);
    x.fillStyle='#fff'; x.fillText(u.type+'  x'+u.count,360,92+i*42);
  });
  x.fillStyle='#f0c040'; x.font='13px monospace';
  x.fillText(combat.turn==='player'?'Your turn — click an enemy':'Enemy is attacking...',240,330);
  x.textAlign='left';
}
function doCombatClick(mx,my){
  if(combat.turn!=='player') return;
  combat.enemyUnits.forEach((u,i)=>{
    if(mx>270 && mx<450 && my>70+i*42 && my<106+i*42){
      const dmg=6+Math.floor(Math.random()*5);
      u.count=Math.max(0,u.count-dmg);
      showMsg('Dealt '+dmg+' damage!');
      if(u.count<=0) combat.enemyUnits.splice(i,1);
      if(!combat.enemyUnits.length){ endCombat(true); return; }
      combat.turn='enemy';
      setTimeout(enemyCombatTurn,700);
      draw();
    }
  });
}
function enemyCombatTurn(){
  if(!combat.playerUnits.length){ endCombat(false); return; }
  const target=combat.playerUnits[0];
  const dmg=4+Math.floor(Math.random()*4);
  target.count=Math.max(0,target.count-dmg);
  showMsg('Enemy dealt '+dmg+' damage!');
  if(target.count<=0) combat.playerUnits.shift();
  if(!combat.playerUnits.length){ endCombat(false); return; }
  if(!combat.enemyUnits.length){ endCombat(true); return; }
  combat.turn='player';
  draw();
}
function endCombat(win){
  if(win){
    gold+=100;
    player.exp+=25;
    if(player.exp>=50){ player.level++; player.exp=0; showMsg('Level Up!'); }
    player.army=combat.playerUnits.filter(u=>u.count>0);
    enemies=enemies.filter(e=>e!==combat.enemy);
    showMsg('Victory! +100 Gold');
    if(!enemies.length){ gameOver(true); return; }
  } else {
    gameOver(false); return;
  }
  state='map';
  combat=null;
  updateHUD();
  draw();
}
function gameOver(win){
  state='over';
  document.getElementById('why').textContent=win?'Victory! All enemies defeated.':'Your army was destroyed.';
  document.getElementById('over').classList.add('show');
}
function updateHUD(){
  document.getElementById('gold').textContent=gold;
  document.getElementById('heroinfo').textContent='Lv'+player.level;
  const p=player.army.find(a=>a.type==='Peasant');
  const a=player.army.find(a=>a.type==='Archer');
  document.getElementById('army').textContent=(p?'P:'+p.count:'')+(a?' A:'+a.count:'');
}
function draw(){
  if(state==='map') drawMap();
  else if(state==='combat') drawCombat();
}
c.onclick=e=>{
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(c.width/r.width);
  const my=(e.clientY-r.top)*(c.height/r.height);
  if(state==='map'){
    const tx=Math.floor(mx/TILE), ty=Math.floor(my/TILE);
    moveTo(tx,ty);
  } else if(state==='combat'){
    doCombatClick(mx,my);
  }
};
document.getElementById('again').onclick=()=>{document.getElementById('over').classList.remove('show'); init();};
function init(){ gold=500; genMap(); updateHUD(); state='map'; showMsg('Move toward the yellow castle!'); draw(); }
init();
</script></body></html>
