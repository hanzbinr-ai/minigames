<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mini Heroes · Mini Game</title><meta name="theme-color" content="#1a1a2e"><link rel="manifest" href="../../manifest.webmanifest"><link rel="icon" href="../../icons/icon-192.png"><link rel="stylesheet" href="../../style.css">
<style>
body{display:flex;flex-direction:column;align-items:center;touch-action:none;padding-top:48px;font-family:monospace;background:#0f0f1a;color:#e0e0e0}
h1{margin:4px 0;font-size:16px;color:#f0c040;text-shadow:2px 2px 0 #000}
#hud{font-size:11px;margin:6px 0;text-align:center}#hud b{color:#f0c040}
canvas{display:block;width:min(96vw,520px);aspect-ratio:4/3;background:#1a2a1a;border:4px solid #000;box-shadow:0 0 0 4px #5a5a5a,6px 6px 0 4px #000}
#hint{font-size:10px;color:#aaa;max-width:96vw;text-align:center;margin-top:10px;line-height:1.4}
#msg{font-size:12px;color:#58d854;min-height:18px;margin:4px 0;text-align:center}
#armybox{font-size:11px;color:#ccc;margin:4px 0;text-align:center;min-height:16px;background:#222;padding:4px;border-radius:4px}
#over{display:none;position:fixed;inset:0;background:#000c;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:20}
#over.show{display:flex}
</style></head><body>
<a class="btn alt tool back" href="../../">◀ PORTAL</a>
<h1>MINI HEROES</h1>
<div id="hud">DAY <b id="day">1</b> · GOLD <b id="gold">500</b> · HERO <b id="heroinfo">Lv1</b></div>
<div id="armybox"></div>
<div id="msg"></div>
<canvas id="c" width="480" height="360"></canvas>
<div id="hint">Enter your town to build/recruit/garrison<br>Enter enemy town to view or attack garrison</div>
<div id="over"><h2 style="color:#e40058;text-shadow:3px 3px 0 #000;margin:0;font-size:22px">GAME OVER</h2><div id="why"></div><button class="btn" id="again">Play Again</button></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=20,H=15,TILE=24;
const UNIT={
  Peasant:{atk:1,def:1,hp:1,spd:4,dmg:[1,1],range:1,skill:'Swarm'},
  Archer:{atk:2,def:1,hp:2,spd:5,dmg:[2,3],range:4,skill:'Ranged'},
  Swordsman:{atk:4,def:3,hp:4,spd:3,dmg:[3,5],range:1,skill:'Cleave'},
  Skeleton:{atk:2,def:1,hp:2,spd:4,dmg:[1,2],range:1,skill:'Undead'},
  Zombie:{atk:2,def:2,hp:3,spd:2,dmg:[2,3],range:1,skill:'Tough'}
};
let map=[],player,enemies=[],playerTown,enemyTown,gold=500,day=1,moves=0,state='map',combat=null,viewTown=null;
function showMsg(t){document.getElementById('msg').textContent=t; setTimeout(()=>document.getElementById('msg').textContent='',2500)}
function genMap(){
  map=Array.from({length:H},()=>Array(W).fill(0));
  for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){
    if(Math.random()<0.1) map[y][xx]=1;
    if(Math.random()<0.03) map[y][xx]=2;
  }
  playerTown={x:2,y:2,owner:'player',buildings:['Fort'],gold:0,garrison:[]};
  enemyTown={x:17,y:12,owner:'enemy',buildings:['Fort'],gold:200,garrison:[{type:'Skeleton',count:3}]};
  map[playerTown.y][playerTown.x]=3;
  map[enemyTown.y][enemyTown.x]=4;
  player={x:4,y:4,level:1,exp:0,army:[{type:'Peasant',count:6}]};
  enemies=[
    {x:10,y:6,level:1,army:[{type:'Skeleton',count:4}]},
    {x:14,y:9,level:2,army:[{type:'Skeleton',count:5}]}
  ];
}
function drawMap(){
  x.fillStyle='#1a2a1a'; x.fillRect(0,0,480,360);
  for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){
    const px=xx*TILE, py=y*TILE;
    const t=map[y][xx];
    x.fillStyle=t===0?'#2d5a2d':t===1?'#1e3d1e':t===2?'#6a6a6a':t===3?'#4a6aaa':'#6a3a3a';
    x.fillRect(px+1,py+1,TILE-2,TILE-2);
    x.strokeStyle='#0004'; x.strokeRect(px,py,TILE,TILE);
    if(t===1){x.fillStyle='#0d2a0d';x.fillRect(px+8,py+6,8,14);x.fillStyle='#2a6a2a';x.fillRect(px+6,py+4,12,6)}
    if(t===2){x.fillStyle='#4a4a4a';x.fillRect(px+4,py+10,16,8)}
    if(t===3||t===4){
      x.fillStyle=t===3?'#c9a227':'#a03030'; x.fillRect(px+3,py+8,18,12);
      x.fillStyle='#e8d48b'; x.fillRect(px+8,py+3,8,8);
    }
  }
  x.fillStyle='#f0c040'; x.font='bold 8px monospace'; x.textAlign='center';
  x.fillText('YOUR TOWN',playerTown.x*TILE+12,playerTown.y*TILE-2);
  x.fillStyle='#e04040'; x.fillText('ENEMY',enemyTown.x*TILE+12,enemyTown.y*TILE-2);
  const px=player.x*TILE, py=player.y*TILE;
  x.fillStyle='#f0c040';
  x.beginPath(); x.arc(px+12,py+12,11,0,Math.PI*2); x.fill();
  x.fillStyle='#1a1a1a'; x.font='bold 14px monospace';
  x.fillText('⚔',px+12,py+17);
  enemies.forEach(e=>{
    const ex=e.x*TILE, ey=e.y*TILE;
    x.fillStyle='#d04040';
    x.beginPath(); x.arc(ex+12,ey+12,11,0,Math.PI*2); x.fill();
    x.fillStyle='#fff'; x.fillText('☠',ex+12,ey+17);
  });
  x.textAlign='left';
}
function drawTown(){
  const town=viewTown||playerTown;
  const isPlayer=town.owner==='player';
  x.fillStyle='#12121e'; x.fillRect(0,0,480,360);
  x.fillStyle=isPlayer?'#f0c040':'#e04040'; x.font='18px monospace'; x.textAlign='center';
  x.fillText(isPlayer?'YOUR TOWN':'ENEMY TOWN',240,32);
  x.font='12px monospace'; x.fillStyle='#fff';
  x.fillText('Buildings: '+town.buildings.join(', '),240,54);
  if(isPlayer){
    const builds=[
      {name:'Barracks', cost:200, unlock:'Peasant'},
      {name:'Archer Tower', cost:300, unlock:'Archer'},
      {name:'Blacksmith', cost:250, unlock:'Swordsman'}
    ];
    builds.forEach((b,i)=>{
      const y=75+i*38;
      const has=town.buildings.includes(b.name);
      x.fillStyle=has?'#2a5a2a':(gold>=b.cost?'#2a6aaa':'#444');
      x.fillRect(40,y,400,32);
      x.fillStyle='#fff'; x.font='11px monospace';
      x.fillText(has?b.name+' (Built)':b.name+'  '+b.cost+'g',240,y+20);
    });
    x.fillStyle='#f0c040'; x.font='12px monospace'; x.fillText('GARRISON',240,200);
    const gar=town.garrison.map(g=>g.type+':'+g.count).join(' | ')||'Empty';
    x.fillStyle='#aaa'; x.font='10px monospace'; x.fillText(gar,240,218);
    x.fillStyle='#3a5a8a'; x.fillRect(60,230,160,28);
    x.fillStyle='#fff'; x.font='11px monospace';
    x.fillText('STATION 2',140,248);
    x.fillStyle='#3a5a8a'; x.fillRect(260,230,160,28);
    x.fillText('TAKE 2',340,248);
  } else {
    x.fillStyle='#aaa'; x.font='12px monospace';
    x.fillText('Garrison: '+(town.garrison.map(g=>g.type+':'+g.count).join(', ')||'None'),240,120);
    x.fillStyle='#7a3a3a'; x.fillRect(140,180,200,36);
    x.fillStyle='#fff'; x.font='13px monospace';
    x.fillText('ATTACK GARRISON',240,202);
  }
  x.fillStyle='#666'; x.fillRect(160,320,160,28);
  x.fillStyle='#fff'; x.font='12px monospace';
  x.fillText('LEAVE',240,338);
  x.textAlign='left';
}
function canMove(nx,ny){
  if(nx<0||ny<0||nx>=W||ny>=H) return false;
  if(map[ny][nx]===2) return false;
  return true;
}
function moveTo(tx,ty){
  if(!canMove(tx,ty)) return;
  const dx=Math.sign(tx-player.x), dy=Math.sign(ty-player.y);
  if(!dx && !dy) return;
  const nx=player.x+dx, ny=player.y+dy;
  if(!canMove(nx,ny)) return;
  player.x=nx; player.y=ny;
  moves++;
  if(moves%5===0){
    gold+=50;
    day++;
    showMsg('Day '+day+'! +50 Gold');
    enemyDevelop();
  }
  checkEvents();
  if(state==='map') enemyTurn();
  updateHUD();
}
function enemyDevelop(){
  enemyTown.gold+=40;
  const builds=['Barracks','Archer Tower','Blacksmith'];
  for(const b of builds){
    const cost=b==='Barracks'?180:b==='Archer Tower'?280:230;
    if(!enemyTown.buildings.includes(b) && enemyTown.gold>=cost && Math.random()<0.5){
      enemyTown.gold-=cost;
      enemyTown.buildings.push(b);
      showMsg('Enemy built '+b+'!');
      break;
    }
  }
  if(enemyTown.buildings.includes('Barracks')){
    let g=enemyTown.garrison.find(a=>a.type==='Skeleton');
    if(g) g.count+=1; else enemyTown.garrison.push({type:'Skeleton',count:1});
  }
}
function checkEvents(){
  if(player.x===playerTown.x && player.y===playerTown.y){
    viewTown=playerTown;
    state='town';
    showMsg('Your town');
    draw();
    return;
  }
  if(player.x===enemyTown.x && player.y===enemyTown.y){
    viewTown=enemyTown;
    state='town';
    showMsg('Enemy town');
    draw();
    return;
  }
  const enemy=enemies.find(e=>e.x===player.x && e.y===player.y);
  if(enemy) startCombat(enemy);
}
function build(name,cost){
  if(gold<cost){ showMsg('Not enough gold!'); return; }
  if(playerTown.buildings.includes(name)) return;
  gold-=cost;
  playerTown.buildings.push(name);
  showMsg(name+' built!');
  updateHUD(); draw();
}
function stationUnits(){
  if(!player.army.length){ showMsg('No units to station'); return; }
  const u=player.army[0];
  const amt=Math.min(2,u.count);
  u.count-=amt;
  if(u.count<=0) player.army.shift();
  let g=playerTown.garrison.find(a=>a.type===u.type);
  if(g) g.count+=amt; else playerTown.garrison.push({type:u.type,count:amt});
  showMsg('Stationed '+amt+' '+u.type);
  updateHUD(); draw();
}
function takeUnits(){
  if(!playerTown.garrison.length){ showMsg('Garrison empty'); return; }
  const g=playerTown.garrison[0];
  const amt=Math.min(2,g.count);
  g.count-=amt;
  if(g.count<=0) playerTown.garrison.shift();
  let u=player.army.find(a=>a.type===g.type);
  if(u) u.count+=amt; else player.army.push({type:g.type,count:amt});
  showMsg('Took '+amt+' '+g.type);
  updateHUD(); draw();
}
function enemyTurn(){
  enemies.forEach(e=>{
    const dx=Math.sign(player.x-e.x), dy=Math.sign(player.y-e.y);
    if(Math.random()<0.4 && canMove(e.x+dx,e.y+dy)){
      e.x+=dx; e.y+=dy;
    }
  });
  const hit=enemies.find(e=>e.x===player.x && e.y===player.y);
  if(hit) startCombat(hit);
  draw();
}
function startCombat(enemy){
  state='combat';
  const BW=8, BH=6;
  combat={enemy,grid:[],plans:[],phase:'plan',selected:null};
  for(let y=0;y<BH;y++) combat.grid[y]=Array(BW).fill(null);
  player.army.forEach((u,i)=>{
    if(i<3) combat.grid[1+i][1]={side:'player',type:u.type,count:u.count,hp:UNIT[u.type].hp*u.count,id:'p'+i};
  });
  const enemyArmy=enemy.army||enemyTown.garrison;
  enemyArmy.forEach((u,i)=>{
    if(i<3) combat.grid[1+i][6]={side:'enemy',type:u.type,count:u.count,hp:UNIT[u.type].hp*u.count,id:'e'+i};
  });
  showMsg('PLAN phase');
  draw();
}
function drawCombat(){
  x.fillStyle='#1a1a2e'; x.fillRect(0,0,480,360);
  x.fillStyle='#f0c040'; x.font='14px monospace'; x.textAlign='center';
  x.fillText(combat.phase==='plan'?'PLAN PHASE':'RESOLVE',240,22);
  const TW=40, TH=36, ox=80, oy=40;
  for(let y=0;y<6;y++) for(let xx=0;xx<8;xx++){
    const px=ox+xx*TW, py=oy+y*TH;
    x.fillStyle='#2a2a3a'; x.fillRect(px+1,py+1,TW-2,TH-2);
    x.strokeStyle='#444'; x.strokeRect(px,py,TW,TH);
    const u=combat.grid[y][xx];
    if(u){
      x.fillStyle=u.side==='player'?'#3a7a3a':'#7a3a3a';
      x.fillRect(px+4,py+4,TW-8,TH-8);
      x.fillStyle='#fff'; x.font='8px monospace';
      x.fillText(u.type.slice(0,4),px+TW/2,py+16);
      x.fillText(u.count,px+TW/2,py+26);
    }
  }
  combat.plans.forEach(p=>{
    if(p.side==='player'){
      x.strokeStyle='#58d854'; x.lineWidth=2;
      x.strokeRect(ox+p.tx*TW+4, oy+p.ty*TH+4, TW-8, TH-8);
      x.lineWidth=1;
    }
  });
  if(combat.selected){
    x.strokeStyle='#f0c040'; x.lineWidth=2;
    x.strokeRect(ox+combat.selected.x*TW, oy+combat.selected.y*TH, TW, TH);
    x.lineWidth=1;
  }
  if(combat.phase==='plan'){
    x.fillStyle='#2a6aaa'; x.fillRect(160,310,160,28);
    x.fillStyle='#fff'; x.font='12px monospace';
    x.fillText('RESOLVE',240,328);
  }
  x.fillStyle='#aaa'; x.font='9px monospace';
  x.fillText(combat.phase==='plan'?'Set actions then RESOLVE':'Resolving...',240,350);
  x.textAlign='left';
}
function isFlanked(defX,defY,atkX,atkY){
  const dx=Math.sign(atkX-defX), dy=Math.sign(atkY-defY);
  const behindX=defX-dx, behindY=defY-dy;
  if(behindX<0||behindY<0||behindX>=8||behindY>=6) return false;
  const behind=combat.grid[behindY][behindX];
  return behind && behind.side!==combat.grid[defY][defX]?.side;
}
function calcDmg(atk,def,atkPos,defPos){
  const uA=UNIT[atk.type], uD=UNIT[def.type];
  let base=uA.dmg[0]+Math.random()*(uA.dmg[1]-uA.dmg[0]);
  let ratio=uA.atk/(uA.atk+uD.def);
  let dmg=base*ratio*atk.count*0.55;
  if(isFlanked(defPos.x,defPos.y,atkPos.x,atkPos.y)) dmg*=1.5;
  if(uA.skill==='Cleave' && Math.random()<0.25) dmg*=1.3;
  if(uD.skill==='Tough') dmg*=0.85;
  return Math.max(1,Math.round(dmg));
}
function canAttack(unit,dist){
  const range=UNIT[unit.type].range||1;
  return dist>=1 && dist<=range;
}
function doCombatClick(mx,my){
  if(combat.phase!=='plan') return;
  const TW=40, TH=36, ox=80, oy=40;
  if(mx>160 && mx<320 && my>310 && my<338){
    resolveCombat();
    return;
  }
  const gx=Math.floor((mx-ox)/TW), gy=Math.floor((my-oy)/TH);
  if(gx<0||gy<0||gx>=8||gy>=6) return;
  const cell=combat.grid[gy][gx];
  if(!combat.selected){
    if(cell && cell.side==='player'){
      combat.selected={x:gx,y:gy};
      showMsg(cell.type+' selected');
      draw();
    }
    return;
  }
  const sel=combat.grid[combat.selected.y][combat.selected.x];
  const dist=Math.abs(gx-combat.selected.x)+Math.abs(gy-combat.selected.y);
  combat.plans=combat.plans.filter(p=>p.id!==sel.id);
  if(cell && cell.side==='enemy' && canAttack(sel,dist)){
    combat.plans.push({id:sel.id,side:'player',type:'attack',sx:combat.selected.x,sy:combat.selected.y,tx:gx,ty:gy});
    showMsg('Attack planned');
  } else if(!cell && dist<=UNIT[sel.type].spd){
    combat.plans.push({id:sel.id,side:'player',type:'move',sx:combat.selected.x,sy:combat.selected.y,tx:gx,ty:gy});
    showMsg('Move planned');
  }
  combat.selected=null;
  draw();
}
function resolveCombat(){
  combat.phase='resolve';
  planEnemy();
  const all=combat.plans.slice();
  all.forEach(p=>{
    const u=findUnit(p.id);
    if(!u) return;
    if(p.type==='move'){
      if(!combat.grid[p.ty][p.tx]){
        combat.grid[p.ty][p.tx]=u.unit;
        combat.grid[u.y][u.x]=null;
      }
    } else if(p.type==='attack'){
      const target=combat.grid[p.ty][p.tx];
      if(target){
        const dmg=calcDmg(u.unit,target,{x:p.sx,y:p.sy},{x:p.tx,y:p.ty});
        target.hp-=dmg;
        target.count=Math.max(0,Math.ceil(target.hp/UNIT[target.type].hp));
        if(target.count<=0) combat.grid[p.ty][p.tx]=null;
      }
    }
  });
  combat.plans=[];
  if(!hasUnits('enemy')){ endCombat(true); return; }
  if(!hasUnits('player')){ endCombat(false); return; }
  combat.phase='plan';
  showMsg('Next PLAN phase');
  draw();
}
function planEnemy(){
  for(let y=0;y<6;y++) for(let xx=0;xx<8;xx++){
    const u=combat.grid[y][xx];
    if(!u || u.side!=='enemy') continue;
    const range=UNIT[u.type].range||1;
    let best=null, bestScore=-1;
    for(let ty=0;ty<6;ty++) for(let tx=0;tx<8;tx++){
      const t=combat.grid[ty][tx];
      if(!t || t.side!=='player') continue;
      const dist=Math.abs(tx-xx)+Math.abs(ty-y);
      if(dist>=1 && dist<=range){
        const score=calcDmg(u,t,{x:xx,y},{x:tx,y:ty});
        if(score>bestScore){ bestScore=score; best={tx,ty,attack:true}; }
      }
    }
    if(best){
      combat.plans.push({id:u.id,side:'enemy',type:'attack',sx:xx,sy:y,tx:best.tx,ty:best.ty});
    } else {
      const tx=xx-1;
      if(tx>=0 && !combat.grid[y][tx]){
        combat.plans.push({id:u.id,side:'enemy',type:'move',sx:xx,sy:y,tx,ty:y});
      }
    }
  }
}
function findUnit(id){
  for(let y=0;y<6;y++) for(let xx=0;xx<8;xx++){
    const u=combat.grid[y][xx];
    if(u && u.id===id) return {unit:u,x:xx,y};
  }
  return null;
}
function hasUnits(side){
  for(let y=0;y<6;y++) for(let xx=0;xx<8;xx++) if(combat.grid[y][xx]?.side===side) return true;
  return false;
}
function endCombat(win){
  if(win){
    gold+=80;
    player.exp+=20;
    if(player.exp>=40){ player.level++; player.exp=0; showMsg('Level Up!'); }
    const remaining=[];
    for(let y=0;y<6;y++) for(let xx=0;xx<8;xx++){
      const u=combat.grid[y][xx];
      if(u && u.side==='player' && u.count>0) remaining.push({type:u.type,count:u.count});
    }
    player.army=remaining;
    if(combat.enemy.garrison){
      enemyTown.garrison=[];
    } else {
      enemies=enemies.filter(e=>e!==combat.enemy);
    }
    showMsg('Victory! +80 Gold');
    if(!enemies.length && !enemyTown.garrison.length){ gameOver(true); return; }
  } else {
    gameOver(false); return;
  }
  state='map'; combat=null; updateHUD(); draw();
}
function gameOver(win){
  state='over';
  document.getElementById('why').textContent=win?'Victory!':'Defeat';
  document.getElementById('over').classList.add('show');
}
function updateHUD(){
  document.getElementById('day').textContent=day;
  document.getElementById('gold').textContent=gold;
  document.getElementById('heroinfo').textContent='Lv'+player.level;
  document.getElementById('armybox').textContent=player.army.map(a=>a.type+':'+a.count).join(' | ') || 'No army';
}
function draw(){
  if(state==='map') drawMap();
  else if(state==='town') drawTown();
  else if(state==='combat') drawCombat();
}
c.onclick=e=>{
  const r=c.getBoundingClientRect();
  const mx=(e.clientX-r.left)*(c.width/r.width);
  const my=(e.clientY-r.top)*(c.height/r.height);
  if(state==='map'){
    const tx=Math.floor(mx/TILE), ty=Math.floor(my/TILE);
    moveTo(tx,ty);
  } else if(state==='town'){
    const town=viewTown||playerTown;
    if(town.owner==='player'){
      const builds=[{name:'Barracks',cost:200},{name:'Archer Tower',cost:300},{name:'Blacksmith',cost:250}];
      builds.forEach((b,i)=>{
        const y=75+i*38;
        if(mx>40 && mx<440 && my>y && my<y+32) build(b.name,b.cost);
      });
      if(mx>60 && mx<220 && my>230 && my<258) stationUnits();
      if(mx>260 && mx<420 && my>230 && my<258) takeUnits();
    } else {
      if(mx>140 && mx<340 && my>180 && my<216){
        startCombat({army:enemyTown.garrison,garrison:true});
      }
    }
    if(mx>160 && mx<320 && my>320 && my<348){
      state='map'; viewTown=null; showMsg('Left Town'); draw();
    }
  } else if(state==='combat'){
    doCombatClick(mx,my);
  }
};
document.getElementById('again').onclick=()=>{document.getElementById('over').classList.remove('show'); init();};
function init(){ gold=500; day=1; moves=0; genMap(); updateHUD(); state='map'; showMsg('Enter towns to manage'); draw(); }
init();
</script></body></html>
