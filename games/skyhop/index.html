<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sky Hop · Mini Game</title><meta name="theme-color" content="#12161f"><link rel="manifest" href="../../manifest.webmanifest"><link rel="icon" href="../../icons/icon-192.png"><link rel="stylesheet" href="../../style.css">
<style>
body{display:flex;flex-direction:column;align-items:center;touch-action:none;padding-top:50px;font-family:monospace}
h1{margin:6px 0;font-size:18px;color:#f2b179;text-shadow:3px 3px 0 #000}#info{margin:8px 0;font-size:12px}#hint{font-size:11px;color:#ccc;max-width:360px;text-align:center;margin-bottom:8px;line-height:1.4}
#box{position:relative;width:min(calc(100vw - 32px),400px)}canvas{display:block;width:100%;height:auto;aspect-ratio:1;background:#70c5ce;border:6px solid #000;box-shadow:0 0 0 4px #fcfcfc,8px 8px 0 4px #000}
#over{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:20}
#over.show{display:flex}#over .btn{margin:4px}
</style></head><body>
<a class="btn alt tool back" href="../../">◀ PORTAL</a>
<h1>SKY HOP</h1>
<div id="hint">Single tap = small rise.<br>Quick / double tap = 125% higher rise.<br>After score 120: nets (slow) & wind (fast).</div>
<div id="info">SCORE <b id="s">0</b> · TOP <b id="b" style="color:#f8b800">0</b></div>
<div id="box"><canvas id="c" width="400" height="400"></canvas></div>
<div id="over"><h2 style="color:#e40058;text-shadow:3px 3px 0 #000;margin:0;font-size:24px">GAME OVER</h2><div>SCORE <b id="fs" style="color:#f8b800">0</b></div>
<button class="btn" id="again">Play Again</button>
<a class="btn alt" href="../../">◀ Back to Portal</a></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let AC;
function beep(freq,dur){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=freq;g.gain.setValueAtTime(0.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}catch(e){}}
let birdY=200,birdV=0,pipes=[],stars=[],effects=[],score=0,best=+localStorage.skyhopBest||0,running=false,frame=0,wing=0,lastTap=0,speedMod=1;
document.getElementById('b').textContent=best;
function reset(){
  birdY=200; birdV=0; pipes=[{x:450,gapY:180,gapH:200}]; stars=[]; effects=[]; score=0; lastTap=0; speedMod=1;
  document.getElementById('s').textContent='0';
  document.getElementById('over').classList.remove('show');
  running=false; frame=0; wing=0; draw();
}
function flap(){
  if(!running){running=true; loop();}
  const now=performance.now();
  const isDouble=now-lastTap<280;
  birdV=isDouble?-3.5:-2.8;
  wing=12;
  lastTap=now;
  beep(isDouble?720:520,0.06);
}
function getGap(){
  if(score>=120) return 95;
  return Math.max(95, 200 - Math.floor(score)*0.9);
}
function loop(){
  if(!running) return;
  birdV+=0.08; birdY+=birdV;
  if(birdV>2.8) birdV=2.8;
  const spd=0.75*speedMod;
  pipes.forEach(p=>p.x-=spd);
  stars.forEach(s=>s.x-=spd);
  effects.forEach(e=>e.x-=spd);
  if(pipes.length && pipes[pipes.length-1].x<140){
    const gapH=getGap();
    pipes.push({x:450,gapY:80+Math.random()*(240-gapH),gapH});
    if(Math.random()<0.45) stars.push({x:450,y:50+Math.random()*300});
    if(score>=120 && Math.random()<0.28){
      effects.push({x:450,type:Math.random()<0.5?'net':'wind',y:60+Math.random()*280});
    }
  }
  if(pipes.length && pipes[0].x<-70) pipes.shift();
  stars=stars.filter(s=>s.x>-20);
  effects=effects.filter(e=>e.x>-30);
  if(wing>0) wing--;
  frame++;
  stars.forEach(s=>{
    const dx=s.x-74, dy=s.y-birdY;
    if(dx*dx+dy*dy<576){ score+=10; s.x=-100; beep(880,0.08); }
  });
  speedMod=1;
  effects.forEach(e=>{
    if(Math.abs(e.x-74)<35 && Math.abs(e.y-birdY)<45){
      speedMod = e.type==='net' ? 0.5 : 1.65;
    }
  });
  const by=birdY;
  if(by<12||by>385||pipes.some(p=>p.x<90&&p.x>30&&(by<p.gapY-p.gapH/2||by>p.gapY+p.gapH/2))){
    running=false;
    beep(220,0.3);
    document.getElementById('fs').textContent=Math.floor(score);
    if(score>best){best=Math.floor(score);localStorage.skyhopBest=best;document.getElementById('b').textContent=best;}
    document.getElementById('over').classList.add('show');
    return;
  }
  score+=0.025;
  document.getElementById('s').textContent=Math.floor(score);
  draw();
  requestAnimationFrame(loop);
}
function drawBird(y){
  const angle=Math.max(-0.5,Math.min(0.7,birdV*0.15));
  x.save();
  x.translate(74,y);
  x.rotate(angle);
  x.fillStyle='#f7dc6f';
  x.beginPath(); x.ellipse(0,0,18,13,0,0,Math.PI*2); x.fill();
  x.fillStyle='#f4d03f';
  x.beginPath(); x.ellipse(2,1,14,9,0,0,Math.PI*2); x.fill();
  const w=wing>0?-14:Math.sin(frame*0.25)*8;
  x.fillStyle='#e67e22';
  x.beginPath(); x.ellipse(-6,3,12,7,w*0.08,0,Math.PI*2); x.fill();
  x.fillStyle='#e74c3c';
  x.beginPath(); x.moveTo(15,-3); x.lineTo(26,0); x.lineTo(15,3); x.fill();
  x.fillStyle='#fff'; x.beginPath(); x.arc(7,-5,5,0,Math.PI*2); x.fill();
  x.fillStyle='#000'; x.beginPath(); x.arc(8,-5,2.5,0,Math.PI*2); x.fill();
  x.restore();
}
function drawMetalPipe(x0,y0,w,h){
  if(h<=0) return;
  x.fillStyle='#5d6d7e'; x.fillRect(x0,y0,w,h);
  x.fillStyle='#d5dbdb'; x.fillRect(x0+6,y0,10,h);
  x.fillStyle='#aeb6bf'; x.fillRect(x0+18,y0,8,h);
  x.fillStyle='#2c3e50'; x.fillRect(x0+w-8,y0,8,h);
  x.fillStyle='#1a252f';
  for(let i=25;i<h;i+=45){
    x.beginPath(); x.arc(x0+14,y0+i,3.5,0,Math.PI*2); x.fill();
    x.beginPath(); x.arc(x0+w-14,y0+i,3.5,0,Math.PI*2); x.fill();
  }
}
function draw(){
  x.fillStyle='#70c5ce'; x.fillRect(0,0,400,400);
  x.fillStyle='rgba(255,255,255,0.55)';
  x.beginPath(); x.arc(90,50,22,0,Math.PI*2); x.arc(112,46,28,0,Math.PI*2); x.fill();
  x.beginPath(); x.arc(290,35,20,0,Math.PI*2); x.arc(310,40,24,0,Math.PI*2); x.fill();
  x.fillStyle='#ded895'; x.fillRect(0,372,400,28);
  x.fillStyle='#5ee270'; x.fillRect(0,362,400,10);
  effects.forEach(e=>{
    if(e.type==='net'){
      x.strokeStyle='rgba(200,200,200,0.75)'; x.lineWidth=2;
      for(let i=-20;i<=20;i+=10){
        x.beginPath(); x.moveTo(e.x+i,e.y-25); x.lineTo(e.x+i,e.y+25); x.stroke();
        x.beginPath(); x.moveTo(e.x-25,e.y+i); x.lineTo(e.x+25,e.y+i); x.stroke();
      }
    } else {
      x.fillStyle='rgba(174,214,241,0.7)';
      x.beginPath(); x.moveTo(e.x,e.y); x.lineTo(e.x-22,e.y-7); x.lineTo(e.x-22,e.y+7); x.fill();
    }
  });
  stars.forEach(s=>{
    x.fillStyle='#f1c40f';
    x.beginPath();
    for(let i=0;i<5;i++){
      const a=i*1.256+frame*0.05;
      const r=i%2?10:5;
      x.lineTo(s.x+Math.cos(a)*r,s.y+Math.sin(a)*r);
    }
    x.fill();
  });
  drawBird(birdY);
  pipes.forEach(p=>{
    const half=p.gapH/2;
    drawMetalPipe(p.x,0,52,p.gapY-half);
    drawMetalPipe(p.x,p.gapY+half,52,400-(p.gapY+half));
    x.fillStyle='#85929e';
    x.fillRect(p.x-6,p.gapY-half-10,64,12);
    x.fillRect(p.x-6,p.gapY+half,64,12);
  });
  if(speedMod<0.8){ x.fillStyle='#fff'; x.font='11px monospace'; x.textAlign='center'; x.fillText('NET',200,26); }
  if(speedMod>1.3){ x.fillStyle='#fff'; x.font='11px monospace'; x.textAlign='center'; x.fillText('WIND',200,26); }
}
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();flap();}});
c.onclick=document.body.onclick=flap;
document.getElementById('again').onclick=reset;
reset();
</script></body></html>
